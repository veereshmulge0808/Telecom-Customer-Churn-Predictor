<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecom Churn AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="max-w-md w-full glass-panel rounded-2xl p-8 shadow-2xl">
        <h1 class="text-3xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Churn Predictor</h1>
        <p class="text-slate-400 mb-8 text-sm">Enter customer profile to calculate retention risk.</p>

        <form id="churnForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Tenure (Months)</label>
                <input type="number" id="tenure" required min="0" max="72" value="12" 
                       class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Monthly Charges ($)</label>
                <input type="number" id="monthlyCharges" required min="0" step="0.01" value="70.00" 
                       class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contract Type</label>
                <select id="contract" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One year</option>
                    <option value="Two year">Two year</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Internet Service</label>
                <select id="internet" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                    <option value="Fiber optic">Fiber optic</option>
                    <option value="DSL">DSL</option>
                    <option value="No">No Internet</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full mt-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-500/30 transition-all transform hover:scale-[1.02]">
                Analyze Risk
            </button>
        </form>

        <!-- Result Card (Hidden by default) -->
        <div id="resultCard" class="hidden mt-8 p-6 rounded-xl border transition-all fade-in">
            <h2 id="resultStatus" class="text-2xl font-bold mb-2"></h2>
            <p id="resultMessage" class="text-sm text-slate-300"></p>
        </div>
    </div>

    <script>
        document.getElementById('churnForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload
            
            const btn = document.getElementById('submitBtn');
            const resultCard = document.getElementById('resultCard');
            const resultStatus = document.getElementById('resultStatus');
            const resultMessage = document.getElementById('resultMessage');
            
            btn.textContent = "Processing Data...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            // 1. Gather data from inputs
            const payload = {
                tenure: document.getElementById('tenure').value,
                monthly_charges: document.getElementById('monthlyCharges').value,
                contract: document.getElementById('contract').value,
                internet: document.getElementById('internet').value
            };

            try {
                // 2. The Phase 2 API Call (Connecting to Flask)
                // Note: Change this URL when you deploy the Flask API to the cloud
                const response = await fetch('https://telecom-customer-churn-predictor-webi.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("Network response was not ok");
                const result = await response.json();
                
                // 3. Update the UI based on the mathematical response
                const probPercent = (result.probability * 100).toFixed(1);
                resultCard.classList.remove('hidden');
                
                if (result.is_high_risk) {
                    resultStatus.textContent = "High Risk of Churn";
                    resultStatus.className = "text-2xl font-bold text-red-400 mb-2";
                    resultMessage.textContent = `Probability: ${probPercent}%. Recommendation: Deploy retention incentives immediately.`;
                    resultCard.className = "mt-8 p-6 rounded-xl border border-red-500/30 bg-red-500/10 shadow-[0_0_20px_rgba(239,68,68,0.15)] fade-in";
                } else {
                    resultStatus.textContent = "Customer is Loyal";
                    resultStatus.className = "text-2xl font-bold text-emerald-400 mb-2";
                    resultMessage.textContent = `Probability: ${probPercent}%. No immediate action required.`;
                    resultCard.className = "mt-8 p-6 rounded-xl border border-emerald-500/30 bg-emerald-500/10 shadow-[0_0_20px_rgba(16,185,129,0.15)] fade-in";
                }
            } catch (error) {
                console.error("API Error:", error);
                alert("Failed to connect to the prediction server. Make sure your Flask app is running.");
            } finally {
                // Reset button state
                btn.textContent = "Analyze Risk";
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
